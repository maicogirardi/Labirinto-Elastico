<!doctype html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Labirinto V2 - Linha Elástica</title>
	<link rel="stylesheet" href="./style.css" />
</head>
	<body>
	<main class="game">
		<h1 class="title">Labirinto Elástico V2</h1>
		<div class="play-area">
			<canvas id="maze" aria-label="Labirinto de linha elástica"></canvas>
			<aside class="sidebar" aria-label="Informações e controles">
				<div class="distance">
					<span>Distância percorrida</span>
					<output id="distance-value">0 mm</output>
				</div>
				<div class="controls">
					<button id="new-maze" type="button">Novo jogo</button>
					<button id="restart" type="button">Recomeçar</button>
				</div>
				<div class="bottom-links">
					<a class="home-link" href="../index.html">Voltar para Home</a>
				</div>
			</aside>
		</div>
		<p id="message" class="message" aria-live="polite">Clique no ponto verde e arraste. A linha não atravessa paredes.</p>
	</main>
	<script src="./script.js"></script>
</body>
</html>
